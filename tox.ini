[tox]
envlist = py312-django{42,52}, quality, docs
requires = tox-uv>=1

[pycodestyle]
exclude = .git,.tox,migrations
max-line-length = 120

[testenv]
runner = uv-venv-lock-runner
dependency_groups =
    django42: django42
    django52: test
commands =
    python -Wd -m pytest {posargs}

[testenv:docs]
runner = uv-venv-lock-runner
dependency_groups = doc
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
commands =
    doc8 --ignore-path docs/_build README.rst docs
    rm -f docs/xss_utils.rst
    rm -f docs/modules.rst
    make -C docs clean
    make -C docs html
    python -m build
    twine check dist/*

[testenv:quality]
runner = uv-venv-lock-runner
dependency_groups = quality
setenv =
    DJANGO_SETTINGS_MODULE = test_settings
    PYTHONPATH = {toxinidir}
allowlist_externals =
    make
    rm
    touch
commands =
    touch tests/__init__.py
    pylint src/xss_utils tests tests_utils manage.py
    rm tests/__init__.py
    pycodestyle src/xss_utils tests manage.py
    pydocstyle src/xss_utils tests manage.py
    isort --check-only --diff tests test_utils src/xss_utils manage.py test_settings.py
    make selfcheck
